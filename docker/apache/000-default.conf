<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory "/var/www/html/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defense-in-depth: jangan pernah eksekusi script di folder upload (storage).
    # Kalaupun ada file .php lolos ter-upload, Apache tolak, bukan jalankan.
    <Directory "/var/www/html/storage">
        <FilesMatch "\.(?:php|phtml|phar|php[0-9]|pht|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
